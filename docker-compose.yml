services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenteval
      POSTGRES_PASSWORD: agenteval
      POSTGRES_DB: agenteval
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  agenteval-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql+psycopg://agenteval:agenteval@postgres:5432/agenteval
      AGENTEVAL_DATA_DIR: /data
    depends_on:
      - postgres
    volumes:
      - agenteval_data:/data

volumes:
  agenteval_data:
  pg_data:
